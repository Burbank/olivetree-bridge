<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Open Olive Tree</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ref = q.get('ref') || ''; // e.g. 43.3.16
  if (!/^\d{1,2}(\.\d+){1,2}$/.test(ref)) {
    document.write('<p>Missing or bad ref. Use ?ref=43.3.16</p>');
    return;
  }
  var deep = 'olivetree://bible/' + ref;
  location.replace(deep);
  setTimeout(function () {
    document.body.innerHTML = '<p>Opening Olive Tree…</p><p><a href="' + deep + '">Tap here if it did not open</a></p><p><code>' + deep + '</code></p>';
  }, 400);
})();
</script></head><body><p>Opening Olive Tree…</p></body></html>
